[package]
name = "fluxkit"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Multi-crate no_std motor-control library workspace entry point"
repository = ""

[features]
default = []
defmt = ["dep:defmt", "fluxkit_core/defmt", "fluxkit_hal/defmt", "fluxkit_math/defmt"]
log = ["fluxkit_core/log"]
serde = ["dep:serde", "fluxkit_core/serde", "fluxkit_hal/serde", "fluxkit_math/serde"]

[dependencies]
critical-section = "1"
defmt = { version = "0.3", optional = true }
fluxkit_core = { path = "../fluxkit_core", package = "fluxkit-core" }
fluxkit_hal = { path = "../fluxkit_hal", package = "fluxkit-hal" }
fluxkit_math = { path = "../fluxkit_math" }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
fluxkit-pmsm-sim = { path = "../fluxkit_pmsm_sim" }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series"] }
static_cell = "2"
