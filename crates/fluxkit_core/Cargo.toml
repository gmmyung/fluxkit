[package]
name = "fluxkit-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Deterministic no_std motor-control core for Fluxkit"
repository = "https://github.com/gmmyung/fluxkit"

[features]
default = []
defmt = ["dep:defmt", "fluxkit_math/defmt"]
log = ["dep:log"]
serde = ["dep:serde", "fluxkit_math/serde"]

[dependencies]
aquamarine = "0.6"
defmt = { version = "0.3", optional = true }
fluxkit_math = { path = "../fluxkit_math", version = "0.1.0" }
log = { version = "0.4", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
